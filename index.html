<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock, Paper, Scissors</h1>

    <div class="class-selector">
        <span>Playing to: <strong id="target-label">5</strong></span>
        <button class="mode-button active" data-target="5">First to 5</button>
        <button class="mode-button" data-target="3">First to 3</button>
    </div>


    <p id="result">Make your choice!</p>


    <button class="choice" data-choice="Rock">Rock</button>
    <button class="choice" data-choice="Paper">Paper</button>
    <button class="choice" data-choice="Scissors">Scissors</button>

    <p>Player: <span id="player-score">0</span></p>
    <p>Computer: <span id="computer-score">0</span></p>


    <button id="reset">Reset</button>

    <p><span>Developed and designed by: Cristhiam Diaz</span></p>

    <script src="script.js"></script>
</body>

</html>
